<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="home.css" />
</head>
<body class="bg-gray-100">

<!-- Popup Modals for Instrument, Strategy, RR -->
<div id="instrument-popup" style="display:none;"></div>
<div id="strategy-popup" style="display:none;"></div>
<div id="rr-popup" style="display:none;"></div>
    <!-- Glassmorphism Sidebar -->
    <div class="group/sidebar fixed left-0 top-0 h-screen bg-gradient-to-b from-blue-50 via-white to-blue-100 shadow-xl rounded-r-xl transition-all duration-300 ease-in-out w-[60px] hover:w-[220px] py-6 flex flex-col z-40">
        <!-- Hamburger Menu Icon -->
        <div class="p-4 flex items-center justify-start">
            <button class="cursor-pointer" aria-label="Menu" title="Menu">
                <!-- Heroicons Menu Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 text-sky-600 hover:text-sky-700 transition-colors duration-300">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
        <!-- Menu Items -->
        <nav class="flex flex-col items-center justify-center flex-1 space-y-8 mt-4">
            <div class="flex items-center gap-3 w-full px-4 py-2 hover:bg-blue-50 hover:rounded-md hover:scale-105 transition-all duration-300 ease-in-out">
                <button class="w-6 h-6 flex items-center justify-center text-sky-600 hover:text-sky-700 transition-colors duration-300" aria-label="Home" title="Home">
                    <!-- Home Icon (Heroicons) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M4.5 10.5V19a1.5 1.5 0 001.5 1.5h3A1.5 1.5 0 0010.5 19v-4.5h3V19a1.5 1.5 0 001.5 1.5h3A1.5 1.5 0 0019.5 19V10.5" />
                    </svg>
                </button>
                <span class="hidden opacity-0 scale-95 group-hover/sidebar:inline-flex group-hover/sidebar:opacity-100 group-hover/sidebar:scale-100 text-gray-700 hover:text-blue-700 font-medium text-sm transition-all duration-300">Home</span>
            </div>
            <a href="analysis.html" class="flex items-center gap-3 w-full px-4 py-2 hover:bg-blue-50 hover:rounded-md hover:scale-105 transition-all duration-300 ease-in-out">
                <span class="w-6 h-6 flex items-center justify-center text-sky-600 hover:text-sky-700 transition-colors duration-300" aria-label="Analysis" title="Analysis">
                    <!-- Chart Bar Icon (Heroicons) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18" />
                        <rect x="7" y="13" width="2" height="5" rx="1" fill="currentColor" />
                        <rect x="11" y="9" width="2" height="9" rx="1" fill="currentColor" />
                        <rect x="15" y="5" width="2" height="13" rx="1" fill="currentColor" />
                    </svg>
                </span>
                <span class="hidden opacity-0 scale-95 group-hover/sidebar:inline-flex group-hover/sidebar:opacity-100 group-hover/sidebar:scale-100 text-gray-700 hover:text-blue-700 font-medium text-sm transition-all duration-300">Analysis</span>
            </a>
            <a href="settings.html" class="flex items-center gap-3 w-full px-4 py-2 hover:bg-blue-50 hover:rounded-md hover:scale-105 transition-all duration-300 ease-in-out">
                <span class="w-6 h-6 flex items-center justify-center text-sky-600 hover:text-sky-700 transition-colors duration-300" aria-label="Settings" title="Settings">
                    <!-- Cog Icon (Heroicons) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a9 9 0 0112.728 0m-12.728 0a9 9 0 000 12.728m12.728-12.728a9 9 0 010 12.728m-12.728 0a9 9 0 0012.728 0" />
                    </svg>
                </span>
                <span class="hidden opacity-0 scale-95 group-hover/sidebar:inline-flex group-hover/sidebar:opacity-100 group-hover/sidebar:scale-100 text-gray-700 hover:text-blue-700 font-medium text-sm transition-all duration-300">Settings</span>
            </a>
        </nav>
    </div>
    <!-- Top Menu Bar -->
    <div class="fixed top-0 left-0 w-full h-[70px] flex items-center justify-between px-6 z-40 sidebar-menu-bar bg-white/30 backdrop-blur-md shadow-md border-b border-white/20 transition-all duration-300 font-sans mb-1">
        <div class="flex items-center">
            <!-- Optional Logo -->
            <svg class="mr-3 w-6 h-6 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="white" />
                <path d="M8 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="text-2xl font-bold tracking-wide text-gray-900">Trading Journal</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- Theme Toggle -->
            <button class="w-8 h-8 flex items-center justify-center rounded-full border border-white/30 bg-white/10 shadow hover:bg-white/20 transition-all duration-200 hover:scale-105" title="Toggle Theme">
                <!-- Moon Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
                </svg>
            </button>
            <span class="text-sm text-gray-800 font-medium" id="user-name">User</span>
            <div class="relative group">
                <img id="profileImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6lrMV6ywgErfkyLqqmIIC0_R_kP1K-vZPHQ&s" alt="Default Profile" class="w-8 h-8 rounded-full object-cover border border-white shadow cursor-pointer transition-transform duration-200 hover:scale-105" />
                <div class="absolute right-0 mt-2 w-36 bg-white/80 border border-white/30 rounded-md shadow-lg py-2 text-sm text-gray-800 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none group-hover:pointer-events-auto">
                    <a href="#" class="block px-4 py-2 rounded hover:bg-white/20 transition-colors duration-200">Profile</a>
                    <a href="#" class="block px-4 py-2 rounded hover:bg-white/20 transition-colors duration-200">Settings</a>
                    <a href="#" class="block px-4 py-2 rounded hover:bg-white/20 transition-colors duration-200" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </div>
    <div class="pt-[71px]"></div>
    <!-- Weekday Bar -->
    <div class="w-full max-w-screen-lg mx-auto mt-1 flex items-center justify-between">
        <div id="weekday-bar" class="w-full rounded-full px-4 py-2 shadow-lg border border-white/10 border-t border-white/10 backdrop-blur-xl bg-gradient-to-br from-indigo-800/40 via-sky-900/40 to-rose-800/40 bg-white/5 flex flex-nowrap gap-4 overflow-x-auto transition-all duration-300">
        <!-- Days will be injected by JS -->
        </div>
    </div>
    <div class="main-content transition-all duration-300 ease-in-out">
        <!-- Trade Entry Bar (Modern, Gradient, Interactive) -->
        <div id="trade-entry-bar" class="w-full max-w-screen-xl mx-auto mt-6 mb-8 p-6 rounded-2xl shadow-xl backdrop-blur-md bg-gradient-to-r from-blue-300 via-purple-200 to-red-200 bg-opacity-40 flex flex-wrap gap-4 justify-between items-center transition-all duration-300 hover:bg-gradient-to-r hover:from-blue-400 hover:via-purple-300 hover:to-red-300 hover:bg-opacity-60" style="font-size:16px;">
            <!-- Instrument Dropdown -->
            <div class="flex flex-col min-w-[120px]">
                <label for="instrument" class="mb-1 text-white font-semibold">Instrument</label>
                <div class="flex items-center gap-2 bg-white/80 border border-gray-300 rounded-md px-2 py-1">
                    <select id="instrument" class="h-9 px-2 border-none rounded-md text-slate-800 bg-transparent focus:bg-blue-100 focus:outline-none">
                        <option>EUR/USD</option>
                        <option>GBP/JPY</option>
                        <option>Gold</option>
                    </select>
                    <button id="add-instrument" class="w-6 h-6 flex items-center justify-center text-blue-600 hover:text-blue-800" title="Add new option">
                        <svg id="add-instrument-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button id="edit-instrument" class="w-6 h-6 flex items-center justify-center text-purple-600 hover:text-purple-800" title="Edit selected option">
                        <svg id="edit-instrument-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-line"><path d="M18 2a2.828 2.828 0 1 1 4 4L7 21H3v-4L18 2z"></path></svg>
                    </button>
                    <button id="delete-instrument" class="w-6 h-6 flex items-center justify-center text-red-500 hover:text-red-700" title="Delete selected option">
                        <svg id="delete-instrument-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"></path><path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
                    </button>
                    <button id="star-instrument" class="w-6 h-6 flex items-center justify-center text-yellow-500 hover:text-yellow-600" title="Set as default">
                        <svg id="star-instrument-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </button>
                </div>
            </div>
            <!-- Strategy Dropdown -->
            <div class="flex flex-col min-w-[120px]">
                <label for="strategy" class="mb-1 text-white font-semibold">Strategy</label>
                <div class="flex items-center gap-2 bg-white/80 border border-gray-300 rounded-md px-2 py-1">
                    <select id="strategy" class="h-9 px-2 border-none rounded-md text-slate-800 bg-transparent focus:bg-blue-100 focus:outline-none">
                        <option>Breakout</option>
                        <option>Reversal</option>
                        <option>Scalping</option>
                    </select>
                    <button id="add-strategy" class="w-6 h-6 flex items-center justify-center text-blue-600 hover:text-blue-800" title="Add new option">
                        <svg id="add-strategy-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button id="edit-strategy" class="w-6 h-6 flex items-center justify-center text-purple-600 hover:text-purple-800" title="Edit selected option">
                        <svg id="edit-strategy-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-line"><path d="M18 2a2.828 2.828 0 1 1 4 4L7 21H3v-4L18 2z"></path></svg>
                    </button>
                    <button id="delete-strategy" class="w-6 h-6 flex items-center justify-center text-red-500 hover:text-red-700" title="Delete selected option">
                        <svg id="delete-strategy-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"></path><path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
                    </button>
                    <button id="star-strategy" class="w-6 h-6 flex items-center justify-center text-yellow-500 hover:text-yellow-600" title="Set as default">
                        <svg id="star-strategy-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </button>
                </div>
            </div>
            <!-- RR Dropdown -->
            <div class="flex flex-col min-w-[120px]">
                <label for="rr" class="mb-1 text-white font-semibold">RR</label>
                <div class="flex items-center gap-2 bg-white/80 border border-gray-300 rounded-md px-2 py-1">
                    <select id="rr" class="h-9 px-2 border-none rounded-md text-slate-800 bg-transparent focus:bg-blue-100 focus:outline-none">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                    </select>
                    <button id="add-rr" class="w-6 h-6 flex items-center justify-center text-blue-600 hover:text-blue-800" title="Add new option">
                        <svg id="add-rr-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button id="edit-rr" class="w-6 h-6 flex items-center justify-center text-purple-600 hover:text-purple-800" title="Edit selected option">
                        <svg id="edit-rr-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-line"><path d="M18 2a2.828 2.828 0 1 1 4 4L7 21H3v-4L18 2z"></path></svg>
                    </button>
                    <button id="delete-rr" class="w-6 h-6 flex items-center justify-center text-red-500 hover:text-red-700" title="Delete selected option">
                        <svg id="delete-rr-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"></path><path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
                    </button>
                </div>
            </div>
            <!-- Date Selector -->
            <div class="flex flex-col min-w-[140px]">
                <label for="trade-date" class="mb-1 text-white font-semibold">Date</label>
                <div class="flex items-center gap-2 bg-white/80 border border-gray-300 rounded-md px-2 py-1">
                    <button id="prev-date" class="w-6 h-6 flex items-center justify-center text-blue-600 hover:text-blue-800" title="Previous Day">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button id="next-date" class="w-6 h-6 flex items-center justify-center text-blue-600 hover:text-blue-800" title="Next Day">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <input type="date" id="calendar-date" class="h-9 px-2 border rounded-md text-slate-800 bg-white" title="Pick a date" />
                </div>
            </div>
            <!-- Profit/Loss Toggle -->
            <div class="flex flex-col min-w-[120px]">
                <label class="mb-1 text-white font-semibold">Result</label>
                <div class="flex gap-4">
                    <button id="profit-btn" type="button" class="h-10 px-6 rounded-xl bg-green-500 text-white font-bold shadow-sm flex items-center gap-2 text-lg"><i class="lucide lucide-check-circle"></i> Profit</button>
                    <button id="loss-btn" type="button" class="h-10 px-6 rounded-xl bg-red-500 text-white font-bold shadow-sm flex items-center gap-2 text-lg"><i class="lucide lucide-x-circle"></i> Loss</button>
                </div>
                <!-- Add Trade Button -->
                <div class="mt-4">
                    <button id="add-trade-btn" type="button" class="h-14 px-10 rounded-xl font-bold text-white text-lg uppercase bg-gradient-to-r from-blue-600 via-purple-600 to-red-500 shadow-xl">Add Trade</button>
                </div>
            </div>
        </div>
        <!-- Trade Viewer Section -->
        <div id="trade-viewer" class="w-full max-w-screen-xl mx-auto mb-10 p-6 rounded-xl shadow-lg backdrop-blur-md bg-gradient-to-r from-blue-300 via-purple-200 to-red-200 bg-opacity-40 transition-all duration-300 hover:bg-gradient-to-r hover:from-blue-400 hover:via-purple-300 hover:to-red-300 hover:bg-opacity-60">
            <div class="flex flex-col gap-4">
                <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                    <div class="flex items-baseline gap-4">
                        <h2 class="text-2xl font-bold text-slate-800">Your Trades</h2>
                        <a href="#" class="text-sm text-blue-700 hover:text-blue-900 font-semibold hover:underline transition-colors">See all trades</a>
                    </div>
                    <div class="flex gap-4 items-center">
                        <select id="filter-strategy" class="h-10 px-3 border border-gray-300 rounded text-slate-800 bg-white shadow-sm hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-colors">
                            <option value="all">All Strategies</option>
                        </select>
                        <button id="star-filter-strategy" class="w-8 h-10 flex items-center justify-center text-yellow-500 hover:text-yellow-600" title="Set as default filter">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </button>
                        <select id="filter-period" class="h-10 px-3 border border-gray-300 rounded text-slate-800 bg-white">
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                            <option value="all">All</option>
                        </select>
                        <div class="flex gap-2">
                            <button id="sort-newest" class="h-10 px-4 rounded bg-blue-100 text-blue-700 font-semibold flex items-center gap-2 hover:bg-blue-200 transition-colors" title="Sort Newest"><i class="lucide lucide-sort-desc"></i>Newest</button>
                            <button id="sort-oldest" class="h-10 px-4 rounded bg-blue-100 text-blue-700 font-semibold flex items-center gap-2 hover:bg-blue-200 transition-colors" title="Sort Oldest"><i class="lucide lucide-sort-asc"></i>Oldest</button>
                            <button id="sort-rr" class="h-10 px-4 rounded bg-blue-100 text-blue-700 font-semibold flex items-center gap-2 hover:bg-blue-200 transition-colors" title="Sort RR"><i class="lucide lucide-filter"></i>RR</button>
                            <button id="sort-result" class="h-10 px-4 rounded bg-blue-100 text-blue-700 font-semibold flex items-center gap-2 hover:bg-blue-200 transition-colors" title="Sort Result"><i class="lucide lucide-filter"></i>Result</button>
                        </div>
                    </div>
                </div>
                <div class="overflow-x-auto mt-4 rounded-xl shadow-sm border border-gray-100 bg-white/50 backdrop-blur-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-blue-50/80 text-slate-700 text-sm uppercase tracking-wider">
                                <th class="px-6 py-4 font-semibold rounded-tl-xl">Instrument</th>
                                <th class="px-6 py-4 font-semibold">Strategy</th>
                                <th class="px-6 py-4 font-semibold">RR</th>
                                <th class="px-6 py-4 font-semibold">Result</th>
                                <th class="px-6 py-4 font-semibold">Date</th>
                                <th class="px-6 py-4 font-semibold rounded-tr-xl text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="trade-list" class="divide-y divide-gray-100 bg-white/80">
                            <!-- Trade rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        
    <!-- Dropdown functionality for Add, Edit, Delete operations -->
    
    
    
    
    
    
    


<!-- API_BASE is already defined at the top of the file -->


<script src="home.js?v=3"></script>

</body>
</html>
