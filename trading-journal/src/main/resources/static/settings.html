    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedImageUrl = localStorage.getItem('profileImageUrl');
            const profileImage = document.getElementById('profileImage');
            if (savedImageUrl) {
                profileImage.src = savedImageUrl;
            }
        });

        document.getElementById('updateImageButton').addEventListener('click', async () => {
            const imageUrl = document.getElementById('imageUrlInput').value;
            const profileImage = document.getElementById('profileImage');
            if (imageUrl) {
                profileImage.src = imageUrl;
                localStorage.setItem('profileImageUrl', imageUrl);

                // Save the image URL to the database
                try {
                    const response = await fetch('save-profile-image.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ imageUrl })
                    });
                    const result = await response.text();
                    if (result === 'Success') {
                        alert('Profile image updated successfully!');
                    } else {
                        alert('Failed to update profile image in the database.');
                    }
                } catch (error) {
                    console.error('Error saving profile image:', error);
                    alert('An error occurred while saving the profile image.');
                }
            }
        });

        document.getElementById('exportDataButton').addEventListener('click', async () => {
            const exportButton = document.getElementById('exportDataButton');
            const originalText = exportButton.textContent;

            // Show loading state
            exportButton.textContent = 'Exporting...';
            exportButton.classList.add('opacity-70');
            exportButton.disabled = true;

            try {
                const response = await fetch('export-data.php');

                // Check if response is valid JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Server did not return JSON');
                }

                const data = await response.json();

                // Handle both old and new data formats
                let tradeData = [];
                let dropdownData = {};
                let validItems = 0;
                let uniqueRRCount = 0;
                let uniqueStrategyCount = 0;
                let uniqueInstrumentCount = 0;

                if (Array.isArray(data)) {
                    // Old format - just an array of trades
                    tradeData = data;
                    if (tradeData.length === 0) {
                        alert('No trade data found to export.');
                        return;
                    }

                    // Count items with RR, strategy, and instrument
                    validItems = tradeData.filter(item =>
                        item.rr && item.strategy && item.instrument
                    ).length;
                } else if (data && data.trades) {
                    // New format with trades and dropdowns
                    tradeData = data.trades;
                    if (tradeData.length === 0) {
                        alert('No trade data found to export.');
                        return;
                    }

                    // Count items with RR, strategy, and instrument
                    validItems = tradeData.filter(item =>
                        item.rr && item.strategy && item.instrument
                    ).length;

                    // Get dropdown data
                    if (data.dropdowns) {
                        dropdownData = data.dropdowns;
                        uniqueRRCount = dropdownData.rr ? dropdownData.rr.length : 0;
                        uniqueStrategyCount = dropdownData.strategies ? dropdownData.strategies.length : 0;
                        uniqueInstrumentCount = dropdownData.instruments ? dropdownData.instruments.length : 0;
                    }
                } else {
                    alert('Invalid data format received from server.');
                    return;
                }

                // Store the data for export
                const exportData = {
                    trades: tradeData,
                    dropdowns: dropdownData
                };

                // Log the data before creating the blob
                console.log('Export data before creating blob:', exportData);

                // Check RR values before export
                if (exportData.trades && exportData.trades.length > 0) {
                    console.log('Sample RR values before export:');
                    for (let i = 0; i < Math.min(5, exportData.trades.length); i++) {
                        console.log(`Trade #${i+1} RR:`, exportData.trades[i].rr);
                    }
                }

                const exportJson = JSON.stringify(exportData, null, 2);
                console.log('Stringified JSON (first 500 chars):', exportJson.substring(0, 500) + '...');

                const blob = new Blob([exportJson], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'trading_data.json';
                a.click();

                URL.revokeObjectURL(url);

                // Store the export data in localStorage for later use with the Telegram button
                localStorage.setItem('lastExportData', exportJson);
                localStorage.setItem('lastExportStats', JSON.stringify({
                    totalRecords: tradeData.length,
                    completeRecords: validItems,
                    uniqueRRCount,
                    uniqueStrategyCount,
                    uniqueInstrumentCount,
                    exportDate: new Date().toISOString()
                }));

                // Prepare success message with dropdown details
                let successMessage = `Data exported successfully!\nExported ${tradeData.length} trade records.\n${validItems} records have complete RR, strategy, and instrument data.`;

                if (uniqueRRCount > 0 || uniqueStrategyCount > 0 || uniqueInstrumentCount > 0) {
                    successMessage += `\n\nExported dropdown menu options:\n`;
                    if (uniqueRRCount > 0) {
                        successMessage += `- ${uniqueRRCount} RR options\n`;
                    }
                    if (uniqueStrategyCount > 0) {
                        successMessage += `- ${uniqueStrategyCount} strategy options\n`;
                    }
                    if (uniqueInstrumentCount > 0) {
                        successMessage += `- ${uniqueInstrumentCount} instrument options\n`;
                    }
                }

                alert(successMessage);

                // Send file to Telegram
                const telegramResponse = await fetch('telegram_bot_send_message.php', {
                    method: 'POST',
                    body: JSON.stringify({ file_content: exportJson, file_name: 'trading_data.json' }),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const telegramResult = await telegramResponse.json();
                console.log('Telegram Response:', telegramResult);

                if (telegramResult.success) {
                    alert('Data exported and sent to Telegram successfully!');
                } else {
                    alert('Data exported, but failed to send to Telegram: ' + (telegramResult.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error exporting data:', error);
                alert('Failed to export data: ' + error.message);
            } finally {
                // Reset button state
                exportButton.textContent = originalText;
                exportButton.classList.remove('opacity-70');
                exportButton.disabled = false;
            }
        });

        document.getElementById('importDataInput').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Show loading indicator
            const importLabel = document.querySelector('label[for="importDataInput"]');
            const originalText = importLabel.textContent;
            importLabel.textContent = 'Importing...';
            importLabel.classList.add('opacity-70');

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const fileData = e.target.result;
                    console.log('Raw file content:', fileData.substring(0, 500) + '...');

                    const data = JSON.parse(fileData);
                    console.log('Parsed import data:', data);

                    // Check if the data is in the expected format
                    if (data.trades && Array.isArray(data.trades)) {
                        console.log('Found trades array in the imported data');

                        // Ensure consistent RR format by removing ":1" if present, or adding it if missing
                        // The backend expects RR values as simple numbers without ":1"
                        data.trades.forEach(trade => {
                            if (trade.rr) {
                                // Remove ":1" suffix if present
                                if (typeof trade.rr === 'string' && trade.rr.includes(':')) {
                                    const parts = trade.rr.split(':');
                                    trade.rr = parts[0];
                                    console.log(`Normalized RR value: ${trade.rr}`);
                                }
                            }
                        });
                    }

                    const response = await fetch('import-data.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    });

                    // Check if the response is properly formatted JSON
                    let result;
                    try {
                        result = await response.json();
                    } catch (jsonError) {
                        console.error('Failed to parse server response as JSON:', jsonError);
                        const textResult = await response.text();
                        alert('Failed to parse server response. Server returned: ' + textResult.substring(0, 100) + (textResult.length > 100 ? '...' : ''));
                        return;
                    }

                    if (result.status === 'success') {
                        // Verify the data in the result
                        let rrCount = 0;
                        let strategyCount = 0;
                        let instrumentCount = 0;
                        let uniqueRrOptions = 0;
                        let uniqueStrategyOptions = 0;
                        let uniqueInstrumentOptions = 0;

                        // If we have detailed stats in the response, use them
                        if (result.stats) {
                            rrCount = result.stats.rrCount || 0;
                            strategyCount = result.stats.strategyCount || 0;
                            instrumentCount = result.stats.instrumentCount || 0;
                            uniqueRrOptions = result.stats.uniqueRrOptions || 0;
                            uniqueStrategyOptions = result.stats.uniqueStrategyOptions || 0;
                            uniqueInstrumentOptions = result.stats.uniqueInstrumentOptions || 0;

                            // Update dropdown values in the database
                            if (result.dropdowns) {
                                // Store dropdown values in localStorage temporarily
                                localStorage.setItem('rrOptions', JSON.stringify(result.dropdowns.rr || []));
                                localStorage.setItem('strategyOptions', JSON.stringify(result.dropdowns.strategies || []));
                                localStorage.setItem('instrumentOptions', JSON.stringify(result.dropdowns.instruments || []));

                                console.log('Dropdown options saved to localStorage');

                                // Update user dropdown values in database
                                try {
                                    const dropdownResponse = await fetch('update-user-dropdowns.php', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                        },
                                        body: JSON.stringify({ dropdowns: result.dropdowns }),
                                    });

                                    const dropdownResult = await dropdownResponse.json();
                                    console.log('Dropdown update result:', dropdownResult);

                                    if (!dropdownResult.success) {
                                        console.error('Failed to update dropdown values:', dropdownResult.error);
                                    }
                                } catch (dropdownError) {
                                    console.error('Error updating dropdown values:', dropdownError);
                                }
                            }

                            alert(`Data imported successfully!\nImported ${result.count} trade records.\n` +
                                `${rrCount} records with RR data\n` +
                                `${strategyCount} records with strategy data\n` +
                                `${instrumentCount} records with instrument data\n\n` +
                                `Imported dropdown options:\n` +
                                `${uniqueRrOptions} RR options\n` +
                                `${uniqueStrategyOptions} strategy options\n` +
                                `${uniqueInstrumentOptions} instrument options\n\n` +
                                `${result.details}`);
                        } else {
                            // Simpler success message without detailed stats
                            alert(`Data imported successfully!\nImported ${result.count} trade records.\n${result.details}`);
                        }
                    } else {
                        alert(`Failed to import data: ${result.error || 'Unknown error'}\n${result.details || ''}`);
                    }
                } catch (error) {
                    console.error('Error importing data:', error);
                    alert('Invalid file format or an error occurred.');
                } finally {
                    // Reset the input and label
                    event.target.value = '';
                    importLabel.textContent = originalText;
                    importLabel.classList.remove('opacity-70');
                }
            };
            reader.readAsText(file);
        });

        // Add event listener for "Send to Telegram" button
        document.getElementById('sendToTelegramButton').addEventListener('click', async () => {
            const telegramButton = document.getElementById('sendToTelegramButton');
            const originalText = telegramButton.innerHTML;

            // Show loading state
            telegramButton.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Sending...';
            telegramButton.classList.add('opacity-70');
            telegramButton.disabled = true;

            try {
                // Try to get the last exported data from localStorage first
                const lastExportData = localStorage.getItem('lastExportData');
                
                if (lastExportData) {
                    // Send the saved data directly via telegram_bot_send_message.php
                    console.log('Sending last exported data from localStorage');
                    
                    const telegramResponse = await fetch('telegram_bot_send_message.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            file_content: lastExportData,
                            file_name: 'trading_data.json'
                        })
                    });
                    
                    const result = await telegramResponse.json();
                    
                    if (result.success) {
                        alert('Last exported data sent to Telegram successfully!');
                    } else {
                        console.log('Failed with first method, trying export_and_send.php');
                        throw new Error('First method failed');
                    }
                } else {
                    // If no data in localStorage, use the export_and_send.php script
                    throw new Error('No data in localStorage');
                }
            } catch (error) {
                console.log('Using export_and_send.php as fallback');
                try {
                    // Use export_and_send.php as fallback
                    const response = await fetch('export_and_send.php');
                    const result = await response.json();

                    if (result.success) {
                        alert('Data exported and sent to Telegram successfully!');
                    } else {
                        alert('Failed to send data to Telegram: ' + (result.error || 'Unknown error'));
                    }
                } catch (secondError) {
                    console.error('Error sending data to Telegram:', secondError);
                    alert('An error occurred while sending data to Telegram.');
                }
            } finally {
                // Reset button state
                telegramButton.innerHTML = originalText;
                telegramButton.classList.remove('opacity-70');
                telegramButton.disabled = false;
            }
        });
    </script>
