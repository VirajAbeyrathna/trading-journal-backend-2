<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientAnimation {
            0% { background: linear-gradient(to bottom right, #4c1d95, #1e3a8a, #0d9488); }
            25% { background: linear-gradient(to bottom right, #1e3a8a, #0d9488, #4c1d95); }
            50% { background: linear-gradient(to bottom right, #0d9488, #4c1d95, #1e3a8a); }
            75% { background: linear-gradient(to bottom right, #4c1d95, #0d9488, #1e3a8a); }
            100% { background: linear-gradient(to bottom right, #4c1d95, #1e3a8a, #0d9488); }
        }

        body {
            animation: gradientAnimation 10s ease infinite;
            background-size: 400% 400%;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white/30 backdrop-blur-md border border-gray-200 rounded-lg shadow-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-center mb-2">Create an Account</h1>
        <p class="text-sm text-gray-500 text-center mb-6">Please fill in the details to sign up</p>
        <form id="signupForm" method="POST" autocomplete="off">
            <div class="mb-4">
                <label for="full-name" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="full-name" name="full_name" class="w-full mt-2 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500" placeholder="Enter your full name" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" class="w-full mt-2 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500" placeholder="Enter your email" required>
            </div>
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" class="w-full mt-2 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500" placeholder="Enter your username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="w-full mt-2 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500" placeholder="Enter your password" required>
            </div>
            <div class="mb-4">
                <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password" class="w-full mt-2 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-xl w-full mt-4 hover:bg-blue-700 shadow flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 1.104-.896 2-2 2s-2-.896-2-2 .896-2 2-2 2 .896 2 2z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 1.104-.896 2-2 2s-2-.896-2-2 .896-2 2-2 2 .896 2 2z" />
                </svg>
                Create Account
            </button>
        </form>
        <script>
            document.getElementById('signupForm').addEventListener('submit', async function(event) {
                event.preventDefault();

                const fullName = document.getElementById('full-name').value;
                const email = document.getElementById('email').value;
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (password !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }

                try {
                    const response = await fetch('http://localhost:8080/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ fullName, email, username, password })
                    });

                    if (response.ok) {
                        alert('Signup successful!');
                        window.location.href = 'login-form.html';
                    } else {
                        const error = await response.text();
                        alert(`Signup failed: ${error}`);
                    }
                } catch (error) {
                    alert('An error occurred while signing up.');
                }
            });
        </script>
        <p class="text-sm text-gray-500 mt-4">
            Already have an account?
            <a href="login-form.html" class="text-blue-600 hover:underline font-medium">Log in</a>
        </p>
    </div>
</body>
</html>
